[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safevibe-test-writer"
version = "0.1.0"
description = "SafeVibe Legacy Test-Writer: iterative, mutation-checked LLM regression-test generation for under-tested Python code (SafeVibe Component 2)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "coverage>=7.0",
    "pytest>=7.0",
]

[project.optional-dependencies]
ollama = ["requests>=2.28"]
hosted = ["requests>=2.28"]

[project.scripts]
testwriter = "testwriter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
